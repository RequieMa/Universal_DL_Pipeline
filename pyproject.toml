[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-dl-pipeline"
version = "0.1.0"
description = "A teaching-first, framework-agnostic deep learning pipeline library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
authors = [
    {name = "RequieMa"},
]
keywords = ["deep-learning", "pipeline", "education", "teaching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.0",
]

[project.urls]
Homepage = "https://github.com/RequieMa/Universal_DL_Pipeline"
Repository = "https://github.com/RequieMa/Universal_DL_Pipeline"

[project.scripts]
dl-pipeline = "pipeline.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pandas-stubs>=3.0.0",
    "types-tqdm>=4.70.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-static-i18n>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.uv]
link-mode = "copy"                  # WSL2 cross-filesystem compatibility

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["pipeline/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["N806", "N803"]  # math notation: W, b, dL_dout are conventional in ML

[tool.ruff.lint.per-file-ignores]
"pipeline/pipeline.py" = ["B027"]  # extract_features is intentionally a no-op

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
markers = [
    "slow: slow tests (integration, E2E)",
]

[tool.mypy]
strict = true
python_version = "3.12"

[dependency-groups]
dev = [
    "scikit-learn>=1.9.0",
]
