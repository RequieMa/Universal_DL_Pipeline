site_name: Universal DL Pipeline
site_description: A teaching-first, framework-agnostic deep learning pipeline library
repo_url: https://github.com/RequieMa/Universal_DL_Pipeline
repo_name: RequieMa/Universal_DL_Pipeline

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
            show_category_heading: true

nav:
  - Home: index.md
  - API Reference:
      - Protocols: api/protocols.md
      - Pipeline: api/pipeline.md
      - Config: api/config.md
      - Registry: api/registry.md
      - Hooks: api/hooks.md
      - Data: api/data.md
      - Training: api/training.md
      - Evaluation: api/evaluation.md
      - Export: api/export.md
      - Adapters: api/adapters.md
      - Utils: api/utils.md
  - Design:
      - Architecture Spec: superpowers/specs/2026-07-28-pipeline-architecture-design.md
      - Phase 1 Framework: superpowers/specs/2026-07-29-phase-1-framework-design.md
      - Phase 2 Table Adapters: superpowers/specs/2026-07-30-phase-2-table-adapters-design.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
